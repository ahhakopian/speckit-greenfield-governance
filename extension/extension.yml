schema_version: "1.0"

extension:
  id: "greenfield-roadmap-lifecycle"
  name: "Greenfield ROADMAP Lifecycle"
  version: "0.1.0"
  description: "Apply governed ROADMAP status transitions after convergence."
  author: "Local Governance"
  license: "MIT"

requires:
  speckit_version: ">=0.16.2,<0.17.0"

provides:
  commands:
    - name: "speckit.greenfield-roadmap-lifecycle.complete"
      file: "commands/speckit.greenfield-roadmap-lifecycle.complete.md"
      description: "Complete a governed Feature and reassess direct dependents."

hooks:
  after_converge:
    command: "speckit.greenfield-roadmap-lifecycle.complete"
    priority: 20
    optional: false
    description: "Apply ROADMAP completion only after clean governed convergence."

tags:
  - "greenfield"
  - "roadmap"
  - "governance"
