schema_version: "1.0"

preset:
  id: "greenfield-governance"
  name: "Greenfield Governance"
  version: "0.3.0"
  description: "Greenfield governance command addenda, including conditional UX/UI governance."
  author: "Local Governance"
  license: "MIT"

requires:
  speckit_version: ">=0.16.2,<0.17.0"

provides:
  templates:
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "Enforce greenfield Feature scope and authority boundaries."
      strategy: "append"
    - type: "command"
      name: "speckit.clarify"
      file: "commands/speckit.clarify.md"
      description: "Route clarification decisions to the correct authority."
      strategy: "append"
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Check architecture compatibility and conditional UX/UI shaping."
      strategy: "append"
    - type: "command"
      name: "speckit.converge"
      file: "commands/speckit.converge.md"
      description: "Perform final architecture and conditional UX/UI compatibility checks."
      strategy: "append"

tags:
  - "greenfield"
  - "governance"
