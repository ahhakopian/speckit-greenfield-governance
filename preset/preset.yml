schema_version: "1.0"

preset:
  id: "greenfield-governance"
  name: "Greenfield Governance"
  version: "0.1.0"
  description: "Phase 2 placeholder command layers for future greenfield governance."
  author: "Local Governance"
  license: "MIT"

requires:
  speckit_version: ">=0.16.2,<0.17.0"

provides:
  templates:
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "Phase 2 placeholder."
      strategy: "append"
    - type: "command"
      name: "speckit.clarify"
      file: "commands/speckit.clarify.md"
      description: "Phase 2 placeholder."
      strategy: "append"
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Phase 2 placeholder."
      strategy: "append"
    - type: "command"
      name: "speckit.converge"
      file: "commands/speckit.converge.md"
      description: "Phase 2 placeholder."
      strategy: "append"

tags:
  - "greenfield"
  - "governance"
