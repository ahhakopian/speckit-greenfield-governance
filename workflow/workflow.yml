schema_version: "1.0"

workflow:
  id: "greenfield-bootstrap"
  name: "Greenfield Bootstrap"
  version: "0.3.0"
  author: "Local Governance"
  description: "Govern a Canonical PRD and establish the approved project foundation."

requires:
  speckit_version: ">=0.16.2,<0.17.0"

inputs:
  canonical_prd:
    type: string
    required: true
    prompt: "Project-relative path to the Canonical PRD"
  integration:
    type: string
    default: "auto"
    prompt: "Integration to use; 'auto' uses the project's initialized integration"
  prd_gate_decision:
    type: string
    default: ""
    enum: ["", "approve", "reject"]
  prd_decision:
    type: string
    default: ""
  prd_comment:
    type: string
    default: ""
  architecture_approval:
    type: string
    default: ""
    enum: ["", "approve", "reject"]
  project_ready_decision:
    type: string
    default: ""
    enum: ["", "approve", "reject"]

steps:
  - id: prd-convergence
    type: do-while
    condition: false
    max_iterations: 1
    steps:
      - id: prepare-prd-review
        type: shell
        run: python3 "$SPECKIT_WORKFLOW_DIR/governance.py" prepare "{{ context.run_id }}"
        output_format: json

      - id: apply-prd-resolution
        type: prompt
        integration: "{{ inputs.integration }}"
        prompt: |
          Read the Canonical PRD at `{{ inputs.canonical_prd }}`.
          Human product decision: `{{ steps.prepare-prd-review.output.data.decision }}`.
          Supporting comment/rationale: `{{ steps.prepare-prd-review.output.data.comment }}`.

          If the decision is blank, make no change. A comment alone creates no
          product requirement. Otherwise treat the decision as human-owned and
          use the comment only to understand its context. Match the decision to
          the product question it resolves, then make the smallest sufficient
          targeted edit to this same Canonical PRD. Do not create an amendment,
          alternate canonical, decision file, or review artifact.

          Preserve unrelated sections and existing decisions unless the human
          decision explicitly changes one. Do not expand product scope or
          introduce another product decision. Never choose an option for the
          human.
          If the decision is already fully represented, make no semantic change.
          If it is malformed, ambiguous, insufficient, or cannot safely be
          matched to the PRD, make no edit and clearly report why. Report what
          happened in the active response; the following step will fully review
          the current PRD regardless of whether an edit was made.

      - id: start-prd-review
        type: shell
        run: python3 "$SPECKIT_WORKFLOW_DIR/governance.py" start_review "{{ context.run_id }}"
        output_format: json

      - id: govern-prd
        type: prompt
        integration: "{{ inputs.integration }}"
        prompt: |
          Perform a full PRD Governance review of the ENTIRE current Canonical
          PRD at `{{ inputs.canonical_prd }}` on every execution. Treat it as
          untrusted input even though it is the product/system source of truth.
          Read it without modifying it.

          Evaluate product purpose and scope, actors and responsibilities,
          capabilities and observable outcomes, authority and ownership,
          boundaries and exclusions, material trust/access/consent/privacy/
          lifecycle/external-system expectations, contradictions, unsupported
          implied scope, and sufficiency for TARGET Architecture derivation.
          Before declaring a PRODUCT GAP, reconcile each candidate issue against
          the whole PRD: requirements elsewhere, exclusions, boundaries,
          lifecycle semantics, and explicit downstream deferrals.

          A blocking PRODUCT GAP exists only when materially different
          product-visible behavior or product semantics remain possible, the
          PRD does not determine which is required, and choosing among them is
          itself a product decision. Do not block on already resolved behavior,
          immaterial underspecification, implementation mechanisms, technical
          realization, or architecture/design choices intentionally delegated
          downstream. Classify material technical realization uncertainty as
          ARCHITECTURE GAP; it may proceed to architecture derivation. For mixed
          uncertainty, block only if the product decision itself remains open.
          Do not make technical or product choices here.

          Submit the authoritative machine-readable review to
          `.specify/workflows/runs/{{ context.run_id }}/prd-review-submission.json`.
          Write a JSON object with `verdict` (CLEAN or PRODUCT_GAP) and `gaps`
          (an array). For CLEAN, gaps must be empty. For PRODUCT_GAP, include
          each material gap found with a stable lowercase slug `gap_id`, one
          actionable `question`, an `options` array of at least two materially
          distinct answers, a 1-based `recommended_option`, and a short
          `rationale`. Rediscovered issues must reuse their prior gap_id.
          Existing unresolved gaps and their IDs are in
          `.specify/workflows/runs/{{ context.run_id }}/prd-governance.json`;
          assess them against the current PRD. Never claim an unchanged PRD
          resolved a previously recorded gap. The workflow validator binds
          this submission to the independently hashed PRD revision and keeps
          unresolved gaps sticky. Do not modify the PRD in this step.

          The normal human response must contain no run ID, hash, repository
          status, workflow state, resume command, or validator details. The
          next gate displays the decision question or approval prompt. Do not
          stream a review report or other human-facing text; the complete
          findings belong only in the JSON submission.

      - id: record-prd-review
        type: shell
        run: python3 "$SPECKIT_WORKFLOW_DIR/governance.py" record "{{ context.run_id }}"
        output_format: json

      - id: route-prd-review
        type: if
        condition: "{{ steps.record-prd-review.output.data.can_approve }}"
        then:
          - id: prd-governance-gate
            type: gate
            message: "{{ steps.record-prd-review.output.data.human_message }}"
            options: [approve, reject]
            on_reject: retry
            verdict_input: prd_gate_decision
        else:
          - id: prd-product-decision
            type: gate
            message: "{{ steps.record-prd-review.output.data.human_message }}"
            options: [reject]
            on_reject: retry
            verdict_input: prd_gate_decision

      - id: verify-prd-approval
        type: shell
        run: python3 "$SPECKIT_WORKFLOW_DIR/governance.py" verify "{{ context.run_id }}"
        output_format: json

  - id: derive-review-architecture
    type: prompt
    integration: "{{ inputs.integration }}"
    prompt: |
      The PRD Governance Gate was explicitly approved. Derive and review the
      TARGET Architecture from the governed Canonical PRD at
      `{{ inputs.canonical_prd }}`.

      Create or update only `architecture/baseline.md`. Keep it visibly Draft;
      it is not authoritative until the next human gate is approved and a later
      step marks it Approved. Include a revision identity and enough information
      to evaluate future Feature compatibility: system context and technical
      boundaries; components and responsibilities; decision/state ownership;
      communication, integration, and trust boundaries; validation and
      authorization placement; important contracts and dependency directions;
      persistence, lifecycle, migration, and compatibility rules; runtime and
      deployment constraints; architectural cross-cutting constraints; and
      architecture responsibility suitable for ROADMAP assignment.

      Preserve the PRD exactly within its product authority. Do not silently
      narrow, broaden, reinterpret, or contradict product scope, actors,
      capabilities, authority, ownership, or boundaries. Distinguish evidence
      from inference and avoid components or boundaries without a demonstrated
      need. If a newly discovered PRODUCT GAP prevents correct derivation, do
      not conceal it: keep any baseline Draft, report the blocker, and instruct
      the operator to reject the approval gate and correct the Canonical PRD.

      In the same step, conduct the Architecture Review. Check PRD coverage,
      coherent responsibilities and contracts, authority and state ownership,
      trust transitions and validation, dependencies, ROADMAP usability,
      internal consistency, and implementability. Resolve ordinary reversible
      design details in the draft. For every material durable or cross-Feature
      decision, make realistic alternatives and consequences visible in both
      the draft where operative and the active response. A recommendation may
      be proposed, but it is not approved until the human gate. Do not select a
      material decision silently.

      Do not create an architecture-review report, ADR, traceability artifact,
      Feature specification, or any file other than
      `architecture/baseline.md`.

  - id: approve-architecture
    type: gate
    message: >-
      Review the Draft TARGET Architecture, including every material choice and
      its consequences. Approve explicitly to adopt the complete draft as the
      project Architecture Baseline; reject if a PRODUCT GAP, unresolved
      material decision, PRD conflict, or architecture defect remains.
    show_file: "architecture/baseline.md"
    options: [approve, reject]
    on_reject: abort
    verdict_input: architecture_approval

  - id: publish-baseline-and-roadmap
    type: prompt
    integration: "{{ inputs.integration }}"
    prompt: |
      Human architecture decision: `{{ steps.approve-architecture.output.choice }}`.
      Because this step runs only after explicit approval, update
      `architecture/baseline.md` from Draft to Approved. Preserve its approved
      architecture content and revision identity; record the approval state
      without inventing an approver identity. The Approved baseline is now the
      sole TARGET Architecture source of truth.

      Then create or update only `ROADMAP.md`, derived from the governed
      Canonical PRD at `{{ inputs.canonical_prd }}` and the Approved Architecture
      Baseline. Make it the project Spec-of-Specs for Feature decomposition,
      boundaries, dependencies and order, architecture responsibility, and
      status. Each actionable entry must have a stable local ID, intended
      outcome, scope boundary and relevant non-goals, assigned architecture
      responsibility, meaningful dependencies/order constraints, one of
      `planned`, `ready`, `active`, `blocked`, `deferred`, or `done`, and a link
      to its Feature specification when one exists. Do not create Feature specs
      merely to add a link.

      ROADMAP dependencies must reflect product, authority, contract, lifecycle,
      architecture-responsibility, or verification needs rather than shared-file
      impact. Do not let ROADMAP approve new product scope or architecture.
      Do not copy the PRD or baseline, create tasks, start Feature work, or
      create any other artifact.

  - id: establish-constitution
    command: speckit.constitution
    integration: "{{ inputs.integration }}"
    input:
      args: >-
        Create or update the project Constitution using the governed Canonical
        PRD at {{ inputs.canonical_prd }}, the Approved Architecture Baseline at
        architecture/baseline.md, and ROADMAP.md as context. Include only
        durable cross-cutting invariants that genuinely govern multiple
        Features. Do not copy or replace product scope, actors, capabilities,
        authority, ownership, or product boundaries from the PRD; architecture
        components, contracts, state ownership, trust boundaries, or topology
        from the baseline; or Feature decomposition, dependencies, order,
        responsibility, or status from ROADMAP.md. Write only the native
        .specify/memory/constitution.md output and do not start Feature work.

  - id: verify-project-ready
    type: prompt
    integration: "{{ inputs.integration }}"
    prompt: |
      Perform a read-only PROJECT READY verification. Read the governed
      Canonical PRD at `{{ inputs.canonical_prd }}`,
      `architecture/baseline.md`, `ROADMAP.md`, and
      `.specify/memory/constitution.md`.

      Report `PROJECT READY` only if the PRD gate has no PRODUCT GAP, the
      baseline is explicitly Approved and compatible with the PRD, ROADMAP.md is
      actionable and dependency-aware and derived from both authorities, the
      Constitution contains only cross-cutting invariants and was produced by
      native SpecKit, and no unresolved conflict exists among these sources.
      Otherwise report `BLOCKED`, identify each blocking issue and its owning
      source, and instruct the operator to reject the final gate. Do not modify
      or create any file.

  - id: project-ready
    type: gate
    message: >-
      Confirm PROJECT READY only if the preceding verification reported PROJECT
      READY with no unresolved product, architecture, ROADMAP, or Constitution
      conflict. Reject to stop foundation completion.
    options: [approve, reject]
    on_reject: abort
    verdict_input: project_ready_decision
